name: link-hub-tests
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: linkhub_test
      POSTGRES_PASSWORD: local-test-only
      POSTGRES_DB: linkhub_test
    ports:
      - "127.0.0.1:55485:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U linkhub_test -d linkhub_test"]
      interval: 2s
      timeout: 3s
      retries: 20
