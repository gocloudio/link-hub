syntax = "proto3";

package linkhub.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/gocloudio/link-hub/backend/gen/linkhub/v1;linkhubv1";

service HubService {
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  rpc ListCards(ListCardsRequest) returns (ListCardsResponse);
  rpc GetCard(GetCardRequest) returns (GetCardResponse);
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc GetCardPreferences(GetCardPreferencesRequest) returns (GetCardPreferencesResponse);
  rpc SetCardFavorite(SetCardFavoriteRequest) returns (SetCardFavoriteResponse);
  rpc SaveCardOrder(SaveCardOrderRequest) returns (SaveCardOrderResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  rpc CreateCard(CreateCardRequest) returns (CreateCardResponse);
  rpc UpdateCard(UpdateCardRequest) returns (UpdateCardResponse);
  rpc DeleteCard(DeleteCardRequest) returns (DeleteCardResponse);
  rpc CreateCategory(CreateCategoryRequest) returns (CreateCategoryResponse);
  rpc UpdateCategory(UpdateCategoryRequest) returns (UpdateCategoryResponse);
  rpc DeleteCategory(DeleteCategoryRequest) returns (DeleteCategoryResponse);
}

message Category {
  string id = 1;
  string name = 2;
  int32 card_count = 3;
}

message Card {
  string id = 1;
  string name = 2;
  string description_markdown = 3;
  string url = 4;
  repeated string category_ids = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool is_private = 8;
  string owner_id = 9;
  repeated string shared_user_ids = 10;
  bool can_edit = 11;
}

message CardInput {
  string name = 1;
  string description_markdown = 2;
  string url = 3;
  repeated string category_ids = 4;
  bool is_private = 5;
  repeated string shared_user_ids = 6;
}

message ListCategoriesRequest {}
message ListCategoriesResponse { repeated Category categories = 1; }
message ListCardsRequest { string category_id = 1; }
message ListCardsResponse { repeated Card cards = 1; }
message GetCardRequest { string id = 1; }
message GetCardResponse { Card card = 1; }
message GetMeRequest {}
message GetCardPreferencesRequest {}
message GetCardPreferencesResponse {
  repeated string favorite_card_ids = 1;
  repeated string ordered_card_ids = 2;
}
message SetCardFavoriteRequest {
  string card_id = 1;
  bool favorite = 2;
}
message SetCardFavoriteResponse {}
message SaveCardOrderRequest { repeated string card_ids = 1; }
message SaveCardOrderResponse {}
message Member {
  string id = 1;
  string name = 2;
  string username = 3;
}
message ListMembersRequest {}
message ListMembersResponse { repeated Member members = 1; }
message GetMeResponse {
  string id = 1;
  string name = 2;
  string username = 3;
  bool is_admin = 4;
}
message CreateCardRequest { CardInput card = 1; }
message CreateCardResponse { Card card = 1; }
message UpdateCardRequest {
  string id = 1;
  CardInput card = 2;
  google.protobuf.Timestamp expected_updated_at = 3;
}
message UpdateCardResponse { Card card = 1; }
message DeleteCardRequest { string id = 1; }
message DeleteCardResponse {}
message CreateCategoryRequest { string name = 1; }
message CreateCategoryResponse { Category category = 1; }
message UpdateCategoryRequest {
  string id = 1;
  string name = 2;
}
message UpdateCategoryResponse { Category category = 1; }
message DeleteCategoryRequest { string id = 1; }
message DeleteCategoryResponse {}
